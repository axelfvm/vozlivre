services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vam
      POSTGRES_USER: vam
      POSTGRES_PASSWORD: vam
    ports:
      - "55432:5432"
    volumes:
      - vam_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vam -d vam"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  livekit:
    image: livekit/livekit-server:v1.9.11
    command: --config /etc/livekit.yaml
    volumes:
      - ./infra/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    depends_on:
      - redis

volumes:
  vam_postgres:
