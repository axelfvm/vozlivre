services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - ${ENV_FILE:-.env.production}
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - vozlivre_uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_LIVEKIT_URL: ${VITE_LIVEKIT_URL:?Defina VITE_LIVEKIT_URL}
        VITE_GIPHY_API_KEY: ${VITE_GIPHY_API_KEY:-}
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  vozlivre_uploads:
